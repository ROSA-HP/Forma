<span class="material-symbols-outlined text-[22px]">add_task</span>

<script>
  // DOM element micro-interactions without exterior libraries
  (function() {
    // Clear exercise name
    const clearBtn = document.getElementById('clearNameBtn');
    const nameInput = document.getElementById('exerciseName');
    if (clearBtn && nameInput) {
      clearBtn.addEventListener('click', () => {
        nameInput.value = '';
        nameInput.focus();
      });
    }

    // Category chips selection
    const categoryChips = document.querySelectorAll('.category-chip');
    categoryChips.forEach(chip => {
      chip.addEventListener('click', () => {
        categoryChips.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-surface-container-high', 'text-on-surface');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        chip.setAttribute('aria-checked', 'true');
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
        chip.classList.add('bg-surface-container-high', 'text-on-surface');
      });
    });

    // Secondary Muscle Multi-select
    const secChips = document.querySelectorAll('.sec-chip');
    secChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isSelected = chip.getAttribute('data-selected') === 'true';
        const checkIcon = chip.querySelector('.material-symbols-outlined');
        if (isSelected) {
          chip.setAttribute('data-selected', 'false');
          chip.classList.remove('bg-surface-container-highest', 'text-primary-container');
          chip.classList.add('bg-surface-container', 'text-on-surface-variant');
          if (checkIcon) checkIcon.classList.add('hidden');
        } else {
          chip.setAttribute('data-selected', 'true');
          chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
          chip.classList.add('bg-surface-container-highest', 'text-primary-container');
          if (checkIcon) checkIcon.classList.remove('hidden');
        }
      });
    });

    // Tracking Type Cards selection
    const trackingCards = document.querySelectorAll('.tracking-card');
    trackingCards.forEach(card => {
      card.addEventListener('click', () => {
        trackingCards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-surface-container-high');
          c.classList.add('bg-surface-container');
          
          const icon = c.querySelector('.material-symbols-outlined:first-child');
          if (icon) {
            icon.classList.remove('text-primary-container');
            icon.classList.add('text-outline');
          }

          const badge = c.querySelector('.w-6.h-6');
          if (badge) {
            badge.classList.add('hidden');
          }
        });

        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-surface-container');
        card.classList.add('bg-surface-container-high');

        const activeIcon = card.querySelector('.material-symbols-outlined:first-child');
        if (activeIcon) {
          activeIcon.classList.remove('text-outline');
          activeIcon.classList.add('text-primary-container');
        }

        const activeBadge = card.querySelector('.w-6.h-6');
        if (activeBadge) {
          activeBadge.classList.remove('hidden');
        }
      });
    });

    // Simple submission feedback
    const saveButtons = [document.getElementById('headerSaveBtn'), document.getElementById('saveAndAddBtn')];
    saveButtons.forEach(btn => {
      if (!btn) return;
      btn.addEventListener('click', () => {
        const originalText = btn.innerHTML;
